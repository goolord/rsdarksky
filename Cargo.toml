[package]
name = "rsdarksky"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Simple Pirate Weather client for scripted status bars"
repository = "https://github.com/goolord/rsdarksky"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
